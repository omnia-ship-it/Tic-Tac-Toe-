{% extends "layout.html" %}

{% block content %}
<div class="leaderboard-wrapper">
    <h1>Leaderboard</h1>

    <table class="leaderboard-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Player</th>
                <th>Wins</th>
                <th>Losses</th>
                <th>Draws</th>
            </tr>
        </thead>
        <tbody>
            {% for player in players %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ player.username }}</td>
                <td>{{ player.wins }}</td>
                <td>{{ player.losses }}</td>
                <td>{{ player.draws }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5">No results recorded yet</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
